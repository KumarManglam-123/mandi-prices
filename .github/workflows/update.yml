name: Update Mandi Prices

on:
  schedule:
    - cron: "30 3 * * *"   # runs daily at ~9:00 AM IST (03:30 UTC)
  workflow_dispatch: {}     # lets you also trigger it manually from GitHub

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Pull latest mandi prices and rebuild site
        env:
          DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY }}
        run: python scripts/pull_data.py

      - name: Commit and push updated site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html data.json
          git diff --quiet --cached || git commit -m "Auto-update mandi prices $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
